<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>footballDop LIVE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0e1117;color:white;
 font-family:Arial,sans-serif;padding:16px
}
header{display:flex;align-items:center;justify-content:space-between}
.logo{color:#ff7900;font-size:24px;font-weight:bold}
.live{background:#ff7900;padding:5px 10px;border-radius:20px}
.nav{display:flex;gap:10px;margin:20px 0}
.nav button{flex:1;background:#222833;color:white;border:0;padding:12px;border-radius:10px}
.card{background:#1b222d;padding:15px;border-radius:14px;margin:12px 0}
.match{display:flex;justify-content:space-between;align-items:center;text-align:center}
.team{width:40%;font-weight:bold}
.time{color:#ff7900;font-weight:bold}
a{color:#ff7900;text-decoration:none}
h3{margin-top:0}
button{cursor:pointer}
</style>
</head>
<body>

<header>
 <div class="logo">⚽ footballDop</div>
 <div class="live">LIVE</div>
</header>

<div class="nav">
 <button onclick="show('matches')">⚽ Матчтар</button>
 <button onclick="show('streams')">📺 LIVE</button>
 <button onclick="show('chat')">💬 Чат</button>
</div>

<div id="matches">
 <div class="card">
  <h3>📅 Матчтар</h3>
  <p>Матчтардың кестесі</p>
  <a href="./live.html">Матчтар кестесін ашу →</a>
 </div>
</div>

<div id="streams" style="display:none">
 <div class="card">
  <h3>📺 Трансляциялар</h3>
  <p>Матч трансляцияларын көруге арналған ресми сілтемелер</p>
  <a href="https://t.me/footballDop">Сілтемелер →</a>
 </div>
</div>

<div id="chat" style="display:none">
 <div class="card">
  <h3>💬 Жанкүйерлер</h3>
  <p>Футбол жанкүйерлерімен бірге бол!</p>
  <a href="https://t.me/footballDop">Telegram арнасы →</a>
 </div>
</div>

<script>
function show(id){
 document.getElementById('matches').style.display='none';
 document.getElementById('streams').style.display='none';
 document.getElementById('chat').style.display='none';
 document.getElementById(id).style.display='block';
}
Telegram.WebApp.ready();
Telegram.WebApp.expand();
</script>

</body>
</html>
